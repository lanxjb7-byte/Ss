name: build-lixxzy-rat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Keystore Otomatis
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lixxzy \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeme -keypass changeme \
            -dname "CN=Lixxzy, OU=Dev, O=Lixxzy, L=NA, ST=NA, C=NA"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK (Retry x3)
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASS: changeme
          KEY_ALIAS: lixxzy
          KEY_PASS: changeme
        run: |
          # Coba build, kalau gagal tunggu 15 detik, coba lagi (maks 3x)
          n=0
          until [ "$n" -ge 3 ]
          do
             gradle assembleRelease --no-daemon && break
             n=$((n+1)) 
             echo "Build gagal (kemungkinan server Maven penuh). Mencoba ulang dalam 15 detik... ($n/3)"
             sleep 15
          done

      - name: Upload APK
       uses: actions/upload-artifact@v4
       with:
       name: lixxzy-rat-apk
       path: "**/*.apk"
       if-no-files-found: warn
